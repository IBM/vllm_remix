- place_jobs:
    import: .mapping_placement
    logging: "Placing jobs..."
    arguments:
      - layer_job_graph
      - options
    generate_graphs: "debug/final_jobs_placed"
- apply_transformation:
    import: tads.tads_bindings
    logging: "Inserting transfer jobs..."
    arguments:
      - layer_job_graph
      - "insert_transfer_jobs"
      - system: system
    generate_graphs: "debug/transfer_inserted"
