- map_jobs:
    import: .mapping_placement
    logging: "Mapping virtual nodes..."
    arguments:
      - layer_job_graph
      - options
    return: mapping_d
- apply_transformation:
    import: tads.tads_bindings
    logging: "Lowering virtual nodes to jobs..."
    arguments:
      - layer_job_graph
      - "lower_layers_to_jobs"
      - system: system
      - mappings: mapping_d
    generate_graphs: "debug/jobs"
- map_htree_jobs:
    import: .mapping_placement
    logging: "Getting H-tree mapping..."
    arguments:
      - layer_job_graph
      - system
      - options
    generate_graphs: "debug/htree_mapping"
