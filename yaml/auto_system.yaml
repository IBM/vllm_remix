use_system_defaults: True
implementations:
  blackbox:
  - blackbox
  add:
  - aten::add
  div:
  - aten::div
  relu:
  - aten::relu
  vmm:
  - tads_ops::dense_layer
  max:
  - aten::max
  affine:
  - tads_ops::affine
  max_pool:
  - aten::max_pool1d
  - aten::max_pool2d
  dram_read:
  - tads_ops::global_IN
  dram_write:
  - tads_ops::global_OUT
ops:
  alu_add:
    type: add
    width: 5
    base_latency: 5
    pipeline_stages: 1
    num_input_locks: 2
  alu_div:
    type: div
    width: 5
    base_latency: 5
    pipeline_stages: 1
    num_input_locks: 2
  dpu_relu:
    type: relu
    width: 5
    base_latency: 15
    pipeline_latency: 3
    pipeline_stages: 1
  dpu_max:
    type: max
    width: 5
    base_latency: 15
    pipeline_latency: 3
    pipeline_stages: 1
  tile_relu:
    type: relu
    width: 512
    pipeline_stages: 1
  tile_affine:
    type: affine
    width: 512
    base_latency: 15
    pipeline_latency: 3
    pipeline_stages: 1
  fused_aff_relu:
    type: blackbox
    width: 512
    base_latency: 15
    pipeline_stages: 1
    transformations:
      blackbox:
        subgraph: yaml/fused_aff_relu.yaml
  tile_vmm:
    type: vmm
    width: 10
    base_latency: 100
    pipeline_latency: 20
    pipeline_stages: 1
    transformations:
      mm_to_vmm:
        no_arg: -1
      split_tall_mm:
        max_height: 10
        add_op_name: alu_add
      insert_affine_after_job:
        job_name: tile_vmm
        affine_op_name: tile_affine
  dpu_vmm:
    type: vmm
    width: 32
    base_latency: 100
    pipeline_latency: 20
    pipeline_stages: 1
    transformations:
      split_tall_mm:
        max_height: 5
        add_op_name: alu_add
      split_wide_mm:
        max_width: 5
        split_bias_act: true
  scratchpad_access:
    type: memory_op
    width: 512
    base_latency: 1
    pipeline_stages: 1
    static_energy: 0.0001
interconnects:
  bidirectional_tile_p2p:
    type: p2p
    dir: BI
    width: 512
    base_latency: 30
    stage: true
  bidirectional_fabric_p2p:
    type: p2p
    dir: BI
    width: 512
    base_latency: 60
    stage: true
